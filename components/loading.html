<div id="loader" aria-hidden="true">

  <!-- estrelas de fundo -->
  <canvas id="loaderStars"></canvas>

  <!-- orbe de brilho central -->
  <div class="loader-glow"></div>

  <!-- anéis orbitais -->
  <div class="loader-ring loader-ring--1"></div>
  <div class="loader-ring loader-ring--2"></div>
  <div class="loader-ring loader-ring--3"></div>

  <!-- partículas que explodem -->
  <div class="loader-particles" id="loaderParticles"></div>

  <!-- logo central -->
  <div class="loader-logo">
    <span class="loader-logo__lt">&lt;</span><span class="loader-logo__slash">/</span><span class="loader-logo__gt">&gt;</span>
  </div>

  <!-- barra de progresso -->
  <div class="loader-bar-wrap">
    <div class="loader-bar" id="loaderBar"></div>
  </div>

  <!-- texto de status -->
  <p class="loader-status" id="loaderStatus">inicializando...</p>

</div>
