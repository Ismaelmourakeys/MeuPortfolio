<section id="certificados" class="px-8 py-20 bg-gradient-to-b from-slate-800 to-slate-900" data-animate="left">

    <div class="flex gap-3">
        <span class="w-8 h-8 rounded-lg bg-secondary/10 border border-secondary/30 flex items-center justify-center">
            <span class="font-mono text-secondary text-xs font-bold">&lt;/&gt;</span>
        </span>
        <p class="font-mono text-xs tracking-[0.25em] uppercase text-secondary mb-2">/ Conquistas</p>
    </div>

    <h3 class="font-arial text-4xl sm:text-5xl font-extrabold text-slate-100 leading-tight m-4">
        Meus<span class="text-secondary"> Certificados</span>
    </h3>

    <p class="font-mono text-sm text-slate-500 mb-12 animate-fadeUp [animation-delay:120ms]" data-animate="up">
        Confira alguns dos meus certificados e conquistas.
    </p>

    <!-- carousel wrapper -->
    <div class="relative group">

        <!-- btn prev -->
        <button id="certPrevBtn" class="hidden md:flex absolute left-0 top-1/2 -translate-y-1/2 -translate-x-5 z-20
               w-11 h-11 items-center justify-center rounded-full
               bg-slate-800 border border-slate-600
               text-slate-300 hover:text-secondary hover:border-secondary/50
               opacity-0 group-hover:opacity-100
               transition-all duration-300 shadow-xl">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6" />
            </svg>
        </button>

        <!-- btn next -->
        <button id="certNextBtn" class="hidden md:flex absolute right-0 top-1/2 -translate-y-1/2 translate-x-5 z-20
               w-11 h-11 items-center justify-center rounded-full
               bg-slate-800 border border-slate-600
               text-slate-300 hover:text-secondary hover:border-secondary/50
               opacity-0 group-hover:opacity-100
               transition-all duration-300 shadow-xl">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6" />
            </svg>
        </button>

        <!-- carousel track -->
        <div id="certificados-grid" class="grid grid-flow-col auto-cols-[88%] sm:auto-cols-[65%] md:auto-cols-[420px]
                    gap-5 overflow-x-auto scroll-smooth snap-x snap-mandatory pb-4
                    [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] [scrollbar-width:none]
                    px-1 items-stretch">
        </div>

        <!-- dots -->
        <div class="flex justify-center gap-2 mt-6" id="certificados-dots"></div>

    </div><!-- /group -->

    <!-- MODAL -->
    <div id="certificado-modal"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="relative max-w-4xl w-full">
            <button id="close-certificado" class="absolute -top-12 right-0 flex items-center gap-1.5
                       font-mono text-xs text-slate-400 hover:text-slate-100
                       transition-colors duration-200 z-10">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
                fechar
            </button>
            <img id="certificado-modal-img" src="" alt="Certificado"
                class="w-full max-h-[85vh] object-contain rounded-2xl shadow-2xl border border-white/10" />
        </div>
    </div>

</section>
